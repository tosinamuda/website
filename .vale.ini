StylesPath = .vale
MinAlertLevel = warning
Vocab = Site

Packages = write-good, proselint, alex

[content/blog/*.html]
BasedOnStyles = Vale, write-good, proselint, alex

# Posts embed code samples, inline SVG diagrams and comparison tables. None of that
# is prose, and linting it produces noise that buries the real findings.
BlockIgnores = (?s) *(<pre>.*?</pre>), (?s) *(<svg.*?</svg>), (?s) *(<table.*?</table>), (?s) *(<script.*?</script>)
TokenIgnores = (<code>.*?</code>), (<[^>]+>)

# E-Prime bans every use of "to be". Nobody writes that way, and it drowns the
# findings that matter under hundreds of suggestions.
write-good.E-Prime = NO

# The house style is British, and "will" is fine in a field guide.
proselint.Cursing = NO

# alex checks inclusive language, but on prose about failing runs and killed
# processes it flags 'failure', 'execution' and 'dies' as profanity. Keep the
# checks that catch real bias; drop the ones that only fire on systems vocabulary.
alex.ProfanityUnlikely = NO
alex.ProfanityMaybe = NO
alex.Condescending = NO
